<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAFIQ STORE V5</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"></head><body>
<header><a href="index.html">← المتجر</a><strong>RAFIQ STORE V5 • لوحة التحكم</strong><button id="logout">خروج</button></header><main>
<section id="loginBox"><h2>دخول صاحب المتجر</h2><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><button id="login">دخول</button><button id="signup">إنشاء حساب</button><p id="loginMsg"></p></section>
<div id="app" hidden><div class="tabs"><button data-tab="dashboard">الرئيسية</button><button data-tab="settings">الإعدادات</button><button data-tab="products">المنتجات</button><button data-tab="orders">الطلبات</button></div>
<section id="dashboard" class="tab"><h2>نظرة عامة</h2><div class="stats"><div><b id="statOrders">0</b><span>الطلبات</span></div><div><b id="statSales">0</b><span>إجمالي المبيعات</span></div><div><b id="statProducts">0</b><span>المنتجات</span></div><div><b id="statNew">0</b><span>طلبات جديدة</span></div></div></section>
<section id="settings" class="tab" hidden><h2>إعدادات المتجر</h2><div class="form"><label>اسم المتجر<input id="sName"></label><label>الشعار/الحرف<input id="sMark"></label><label>واتساب<input id="sWa"></label><label>نص التواصل<input id="sContact"></label><label>عنوان الرئيسية<input id="sHero"></label><label>وصف الرئيسية<textarea id="sHeroText"></textarea></label><label>عنوان العرض<input id="sOffer"></label><label>وصف العرض<textarea id="sOfferText"></textarea></label></div><button id="saveSettings">حفظ</button></section>
<section id="products" class="tab" hidden><div class="row"><h2>المنتجات</h2><button id="newProduct">+ إضافة</button></div><div id="productList"></div></section>
<section id="orders" class="tab" hidden><div class="row"><h2>الطلبات</h2><button id="refreshOrders">تحديث</button></div><div id="ordersList"></div></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
